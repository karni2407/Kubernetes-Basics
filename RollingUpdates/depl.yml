apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis-deployment
  namespace: redis-namespace

spec:
  replicas: 3

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
        - name: redis-container
          image: redis:7.2

          ports:
            - containerPort: 80

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
