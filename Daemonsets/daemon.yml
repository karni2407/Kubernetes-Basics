apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: my-daemonset
  namespace: kube-system

spec:
  selector:
    matchLabels:
      name: my-daemonset

  template:
    metadata:
      labels:
        name: my-daemonset

    spec:
      containers:
        - name: my-agent
          image: busybox

          command:
            - sh
            - -c
            - while true; do echo Running; sleep 10; done
