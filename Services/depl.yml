apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-apache-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: my-apache-app

  template:
    metadata:
      labels:
        app: my-apache-app

    spec:
      containers:
        - name: apache-container
          image: httpd:latest

          ports:
            - containerPort: 80

